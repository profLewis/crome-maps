    - method: "Download"
      url: "https://www.digitalearthafrica.org/products/cropland-extent"
  accuracy: >
    Overall accuracy ~83%. Validated using field observations and very high
    resolution satellite imagery across multiple African countries.
  papers:
    - text: "Digital Earth Africa (2022). Cropland Extent Map - Technical Report."
      key: true
  related:
    - name: "Africa AFCD"
      desc: "Alternative 30m African cropland map"
      link: "africa-afcd.html"
    - name: "ESA WorldCover"
      desc: "Global 10m land cover"
      link: "esa-worldcover.html"
  attribution: "Digital Earth Africa / GEO"
  provider: "Digital Earth Africa"

# ──────────────────────────────────────────────────────────────────
# NE CHINA CROPS
# ──────────────────────────────────────────────────────────────────
ne-china-crops:
  title: "Northeast China Crop Types (30m)"
  executive_summary: >
    30m crop type map of Northeast China (Heilongjiang, Jilin, Liaoning) —
    China's most important grain production region. Classifies maize, rice,
    soybeans, and other crops using Sentinel-2 and Landsat imagery.
  coverage: "Northeast China (3 provinces)"
  resolution: "30m"
  temporal: "2020"
  license: "CC-BY 4.0"
  description: >
    Detailed crop type classification for China's "breadbasket" region, which
    produces ~30% of China's grain. Uses multi-temporal satellite imagery to
    distinguish major crops including maize, rice (paddy), soybeans, and wheat.
  provenance: >
    Produced by Chinese Academy of Sciences using Sentinel-2 and Landsat-8
    data with random forest classification. Training data from field surveys
    and government agricultural statistics.
  classification: "Major crops: Maize, Rice (paddy), Soybeans, Wheat, Other crops"
  access:
    - method: "PMTiles"
      url: "Served via the viewer"
  accuracy: >
    Overall accuracy ~88%. Maize and rice achieve >90% accuracy due to distinctive
    phenological patterns. Soybean accuracy ~82%.
  papers:
    - text: "You et al. (2021). Examining the impacts of land use on net primary productivity. Remote Sensing of Environment."
      key: true
  related:
    - name: "China CLCD"
      desc: "National land cover classification"
      link: "china-clcd.html"
    - name: "MODIS Land Cover"
      desc: "Global 500m land cover"
      link: "modis-landcover.html"
  attribution: "Chinese Academy of Sciences"
  provider: "CAS"

# ──────────────────────────────────────────────────────────────────
# CHINA CLCD
# ──────────────────────────────────────────────────────────────────
china-clcd:
  title: "China Land Cover Dataset (CLCD)"
  executive_summary: >
    Annual 30m land cover classification for all of China from 1985 to present.
    Uses Landsat imagery to map 9 land cover types including cropland.
    The longest high-resolution land cover time series for China, enabling
    analysis of 30+ years of agricultural land use change.
  coverage: "China"
  resolution: "30m (Landsat)"
  temporal: "1985-2022 (annual)"
  license: "CC-BY 4.0"
  description: >
    CLCD provides annual 30m land cover maps for China using all available
    Landsat imagery (5/7/8). Nine classes include cropland, forest, shrub,
    grassland, water, snow/ice, barren, impervious, and wetland. The long
    time series enables tracking of cropland expansion, urbanization, and
    reforestation in China.
  provenance: >
    Produced by Wuhan University using Google Earth Engine. Classification:
    random forest on Landsat spectral-temporal features. Training data from
    field surveys and very high resolution imagery.
  classification: >
    9 classes: Cropland, Forest, Shrub, Grassland, Water, Snow/Ice,
    Barren, Impervious (urban), Wetland.
  access:
    - method: "WMS"
      url: "https://zenodo.org/records/8176941"
    - method: "Download"
      url: "https://zenodo.org/records/8176941"
  accuracy: >
    Overall accuracy 79.3% (2020). Cropland: 85.7% producer accuracy,
    83.2% user accuracy. Validated against independent test samples and
    comparison with ESA WorldCover.
  papers:
    - text: "Yang & Huang (2021). The 30m annual land cover dataset and its dynamics in China from 1990 to 2019. Earth System Science Data."
      doi: "https://doi.org/10.5194/essd-13-3907-2021"
      key: true
      open_access: true
  related:
    - name: "NE China Crops"
      desc: "Detailed crop types for NE China"
      link: "ne-china-crops.html"
    - name: "ESA WorldCover"
      desc: "Global 10m land cover"
      link: "esa-worldcover.html"
  attribution: "Wuhan University"
  provider: "Wuhan University"

# ──────────────────────────────────────────────────────────────────
# BRAZIL MAPBIOMAS
# ──────────────────────────────────────────────────────────────────
brazil-mapbiomas:
  title: "Brazil MapBiomas"
  executive_summary: >
    Annual 30m land cover and land use maps of Brazil from 1985 to present,
    produced by the MapBiomas collaborative network. Covers all Brazilian biomes
    with detailed agricultural classes including soybeans, sugarcane, coffee,
    cotton, rice, and pasture. The reference dataset for monitoring deforestation
    and agricultural expansion in Brazil.
  coverage: "Brazil"
  resolution: "30m (Landsat)"
  temporal: "1985-2023 (annual)"
  license: "CC-BY-SA 4.0"
  description: >
    MapBiomas uses the Google Earth Engine platform to process all available Landsat
    imagery for Brazil, producing annual land cover maps with 30+ classes. Agricultural
    classes include temporary crops (soybean, maize, cotton, rice), semi-perennial crops
    (sugarcane), perennial crops (coffee, citrus, oil palm), and pasture. The project
    also monitors deforestation alerts and water surface changes.
  provenance: >
    Collaborative network including universities, NGOs, and technology companies
    (SEEG/OC, IPAM, IMAZON, ISA, others). Uses random forest classification in
    Google Earth Engine with extensive training data from field campaigns and
    high-resolution imagery.
  classification: >
    30+ classes including: Soy Beans, Sugar Cane, Rice, Cotton, Coffee, Citrus,
    Other Temporary Crops, Other Perennial Crops, Pasture, Forest, Savanna,
    Mangrove, Wetland, Urban, Mining, Water, plus biome-specific classes.
  access:
    - method: "WMS"
      url: "https://storage.googleapis.com/mapbiomas-public/initiatives/brasil/collection_8/"
    - method: "Web Viewer"
      url: "https://mapbiomas.org/"
  accuracy: >
    Overall accuracy 89.8% (Collection 8, 2021). Agricultural classes perform well:
    Soy 92%, Sugarcane 90%, Pasture 87%. Forest/non-forest distinction >95%.
  accuracy_table:
    headers: ["Class", "Area Agreement", "Allocation Disagreement"]
    rows:
      - ["Soy Beans", "92%", "5%"]
      - ["Sugarcane", "90%", "6%"]
      - ["Pasture", "87%", "8%"]
      - ["Forest", "95%", "3%"]
      - ["Overall", "89.8%", ""]
    highlight_row: 4
  papers:
    - text: "Souza et al. (2020). Reconstructing Three Decades of Land Use and Land Cover Changes in Brazilian Biomes with Landsat Archive and Earth Engine. Remote Sensing."
      doi: "https://doi.org/10.3390/rs12172735"
      key: true
      open_access: true
  citing_papers:
    - text: "Widely cited in deforestation monitoring and land use change studies for Brazil."
    - text: "Song et al. (2021). Massive soybean expansion in South America. Nature Sustainability."
  related:
    - name: "ESA WorldCover"
      desc: "Global 10m land cover"
      link: "esa-worldcover.html"
    - name: "GFSAD Croplands"
      desc: "Global cropland extent"
      link: "gfsad-croplands.html"
  attribution: "MapBiomas / SEEG / Brazilian institutions"
  provider: "MapBiomas"

# ──────────────────────────────────────────────────────────────────
# HR-VPP PHENOLOGY
# ──────────────────────────────────────────────────────────────────
hrvpp-phenology:
  title: "Copernicus HR-VPP Vegetation Phenology"
  executive_summary: >
    High Resolution Vegetation Phenology and Productivity (HR-VPP) from the Copernicus
    Land Monitoring Service. Provides 13 phenological metrics per pixel at 10m resolution
    across Europe (EEA-39), derived from Sentinel-2 imagery. Covers two growing seasons
    per year from 2017 to 2024. Key metrics include start/end of season dates, peak
    greenness, season length, and seasonal productivity.
  coverage: "Europe (EEA-39)"
  resolution: "10m (Sentinel-2)"
  temporal: "2017-2024 (annual)"
  license: "Copernicus Data Policy (free, open)"
  description: >
    HR-VPP derives vegetation phenology parameters from Sentinel-2 Plant Phenology
    Index (PPI) time series at 10m resolution. PPI is computed from Sentinel-2 L2A
    surface reflectance using the relationship between near-infrared and red bands,
    corrected for soil and atmospheric effects. A smoothed seasonal trajectory is
    fitted to the dekadal (10-day) PPI composites, from which phenological metrics
    are extracted for up to two growing seasons per year.

    Available metrics per season: Start of Season Date (SOSD), End of Season Date
    (EOSD), Date of Maximum PPI (MAXD), PPI values at start/end/peak (SOSV, EOSV,
    MAXV, MINV), Amplitude (AMPL), Season Length (LENGTH), Green-up and Senescence
    rates (LSLOPE, RSLOPE), Seasonal Productivity (SPROD), and Total Productivity (TPROD).
  provenance: >
    Produced by VITO (Flemish Institute for Technological Research) under contract
    to the European Environment Agency (EEA) as part of the Copernicus Land Monitoring
    Service. Input: Sentinel-2 L2A atmospherically corrected surface reflectance.
    Processing chain: PPI computation, cloud/shadow filtering, dekadal compositing,
    Whittaker smoothing, phenological parameter extraction.
  classification: "Continuous phenological metrics (dates as day-of-year, PPI values 0-6, productivity as integrated PPI)"
  access:
    - method: "WMS"
      url: "https://phenology.vgt.vito.be/wms"
      layer: "CLMS_HRVPP_VPP_SOSD_SEASON1_10M (and other VPP/ST layers)"
    - method: "Web Viewer"
      url: "https://land.copernicus.eu/en/products/vegetation/high-resolution-vegetation-phenology-and-productivity"
  accuracy: >
    Validation based on comparison with BBCH phenological observations from PEP725
    network across Europe. Start-of-season date RMSE typically 10-20 days depending
    on crop type and region. Peak greenness timing accuracy ~5-10 days. Higher
    accuracy for cropland and grassland than for forest understory.
  accuracy_table:
    headers: ["Metric", "RMSE (days)", "Bias", "Validation Source"]
    rows:
      - ["Start of Season", "12-18", "-3 to +5", "PEP725 BBCH"]
      - ["End of Season", "15-22", "-5 to +8", "PEP725 BBCH"]
      - ["Peak Date", "5-10", "-2 to +3", "PEP725 BBCH"]
      - ["Season Length", "20-30", "", "Derived"]
  papers:
    - text: "Tian et al. (2021). Calibrating vegetation phenology from Sentinel-2 using eddy covariance, PhenoCam, and PEP725 networks across Europe. Remote Sensing of Environment."
      doi: "https://doi.org/10.1016/j.rse.2020.112275"
      key: true
    - text: "Copernicus Land Monitoring Service HR-VPP Product User Manual"
  citing_papers:
    - text: "Growing use in crop monitoring and agricultural drought assessment across Europe."
  related:
    - name: "MODIS NDVI/EVI"
      desc: "Global vegetation indices (coarser, longer record)"
      link: "gibs-vegetation.html"
    - name: "SAGE Crop Calendars"
      desc: "Statistical crop phenology (coarse, global)"
      link: "crop-calendars.html"
  attribution: "Copernicus Land Monitoring Service / European Environment Agency / VITO"
  provider: "EEA / VITO"

# ──────────────────────────────────────────────────────────────────
# GIBS VEGETATION INDICES
# ──────────────────────────────────────────────────────────────────
gibs-vegetation:
  title: "MODIS NDVI & EVI (NASA GIBS)"
  executive_summary: >
    Global vegetation indices from the MODIS instrument aboard NASA's Terra satellite,
    served as 16-day composites via the Global Imagery Browse Services (GIBS). NDVI
    and EVI provide complementary measures of vegetation greenness and photosynthetic
    activity from 2000 to present at 250m-1km resolution.
  coverage: "Global"
  resolution: "250m-1km"
  temporal: "2000-2025 (16-day composites)"
  license: "Public domain (US Government work)"
  description: >
    The MODIS MOD13A2 product provides two vegetation indices: NDVI (Normalized
    Difference Vegetation Index) and EVI (Enhanced Vegetation Index). NDVI is the
    classical greenness index computed from red and near-infrared reflectance. EVI
    adds blue-band correction for atmospheric effects and has improved sensitivity
    in high-biomass regions (tropical forests) and reduced saturation compared to NDVI.

    In the viewer, mid-July composites are shown by default for each year, representing
    peak Northern Hemisphere growing season. GIBS serves pre-rendered map tiles at
    global coverage.
  provenance: >
    MODIS Terra satellite (launched 1999), operated by NASA. Level 3 vegetation
    index products processed by the Land Processes Distributed Active Archive Center
    (LP DAAC) at USGS EROS. 16-day Maximum Value Composites from daily observations.
    GIBS tile service operated by NASA EOSDIS.
  classification: "Continuous indices: NDVI range -0.2 to 1.0 (typical vegetation 0.2-0.9); EVI range -0.2 to 1.0 (typical vegetation 0.2-0.7)"
  access:
    - method: "WMS"
      url: "https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi"
      layer: "MODIS_Terra_L3_NDVI_16Day / MODIS_Terra_L3_EVI_16Day"
    - method: "Data Download"
      url: "https://lpdaac.usgs.gov/products/mod13a2v061/"
  accuracy: >
    MODIS NDVI/EVI are mature, well-validated products with 20+ years of heritage.
    Radiometric accuracy: +/-0.02 for NDVI over stable targets. Known limitations:
    cloud contamination (mitigated by compositing), atmospheric effects (EVI more
    robust than NDVI), BRDF effects at high sun/view angles.
  papers:
    - text: "Huete et al. (2002). Overview of the radiometric and biophysical performance of the MODIS vegetation indices. Remote Sensing of Environment."
      doi: "https://doi.org/10.1016/S0034-4257(02)00096-2"
      key: true
  citing_papers:
    - text: "Among the most cited remote sensing products (>10,000 citations for Huete et al. 2002)."
    - text: "Used in thousands of studies on crop monitoring, drought, phenology, and land cover change."
  related:
    - name: "HR-VPP Phenology"
      desc: "10m European phenology (higher resolution)"
      link: "hrvpp-phenology.html"
    - name: "SAGE Crop Calendars"
      desc: "Crop planting/harvest timing"
      link: "crop-calendars.html"
  attribution: "NASA EOSDIS / LP DAAC / MODIS Science Team"
  provider: "NASA EOSDIS"

# ──────────────────────────────────────────────────────────────────
# LUCAS 2022
# ──────────────────────────────────────────────────────────────────
lucas-2022:
  title: "LUCAS 2022 Copernicus"
  executive_summary: >
    EU-wide ground truth land cover survey with ~150,000 in-situ observation
    polygons across all 27 member states. Provides 82 detailed land cover classes
    verified by field surveyors, making it the primary validation dataset for
    European land cover mapping. Key reference for accuracy assessment of satellite-
    derived crop maps.
  coverage: "EU-27"
  resolution: "Point/polygon observations (survey plots)"
  temporal: "2022"
  license: "CC-BY 4.0"
  description: >
    LUCAS (Land Use and Coverage Area frame Survey) is a harmonized in-situ
    land cover/use survey conducted by Eurostat across the EU. The 2022 Copernicus
    module provides extended coverage with detailed polygon delineations and
    additional attributes for Copernicus product validation.
  provenance: >
    Conducted by Eurostat with JRC technical support. Field surveyors visit
    stratified random sample points across the EU, recording land cover,
    land use, and environmental variables. The 2022 campaign added a Copernicus
    module with radial polygon delineation around survey points.
  classification: "LUCAS 82-class land cover classification (hierarchical: 8 L1 classes, 35 L2, 82 L3)"
  access:
    - method: "GeoPackage"
      url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/LUCAS/LUCAS_2022_Copernicus/l2022_survey_cop_radpoly_attr.gpkg"
    - method: "JRC Dataset"
      url: "https://data.jrc.ec.europa.eu/dataset/e3fe3cd0-44db-470e-8769-172a8b9e8874"
  accuracy: >
    LUCAS is itself a ground truth dataset used to validate other products.
    Positional accuracy of survey points is +/-2m (GNSS). Classification accuracy
    depends on surveyor training and accessibility of sites. Quality control
    includes re-surveys at 5-10% of points.
  validation_note: >
    LUCAS serves as the primary independent validation source for European
    land cover products including CORINE Land Cover, ESA WorldCover, and
    Copernicus HRL products. Not a product to be validated, but the validator.
  papers:
    - text: "d'Andrimont et al. (2020). Harmonised LUCAS in-situ land cover and use database for field surveys from 2006 to 2018 in the European Union. Scientific Data."
      doi: "https://doi.org/10.1038/s41597-020-00675-z"
      key: true
      open_access: true
    - text: "Eurostat (2022). LUCAS 2022 Technical Reference Document."
  citing_papers:
    - text: "Used as validation in most European land cover mapping studies."
    - text: "Brovelli et al. (2020). User-based accuracy assessment of CORINE Land Cover using LUCAS. Int. J. Geo-Information."
  related:
    - name: "CORINE Land Cover"
      desc: "European land cover validated by LUCAS"
      link: "corine.html"
    - name: "RPA Ground Observation Points"
      desc: "England-specific ground truth (11,000+ points)"
      link: "https://environment.data.gov.uk/dataset/68db4948-cc60-4e4e-807c-c8aa48239cb5"
  attribution: "Eurostat / JRC / European Commission"
  provider: "Eurostat / JRC"

# ──────────────────────────────────────────────────────────────────
# OVERLAY DATASETS
# ──────────────────────────────────────────────────────────────────
overlays:
  title: "Environmental Overlays"
  executive_summary: >
    Contextual environmental datasets from JRC and other sources that complement
    crop and land cover data. Includes Land Productivity Dynamics (vegetation
    productivity trends), River Flood Hazard (100-year return period flood extent),
    and INCA ecosystem service indicators (crop provision capacity, crop pollination
    potential). These overlays provide environmental context for agricultural analysis.
  coverage: "Europe (varies by dataset)"
  resolution: "Varies (300m-1km)"
  temporal: "Varies (2015-2023)"
  license: "Various (JRC open data, Copernicus)"
  description: >
    The overlay datasets provide environmental context that is relevant to crop
    production but is not itself a land cover classification. These datasets help
    answer questions like: Is vegetation productivity increasing or declining? What
    areas face flood risk? Where are ecosystem services like pollination strongest?

    - Land Productivity Dynamics (LPD): Trends in vegetation productivity from
      NDVI time series. Classifies areas as increasing, stable, or declining.
    - River Flood Hazard: 100-year return period flood extent from hydrological modeling.
    - INCA Crop Provision: Ecosystem capacity to provide crops, from the MAES/INCA framework.
    - INCA Crop Pollination: Pollination service potential for agriculture.
  provenance: >
    LPD: JRC, derived from SPOT-VGT/PROBA-V NDVI time series.
    Flood Hazard: JRC LISFLOOD model under EFAS (European Flood Awareness System).
    INCA: JRC MAES (Mapping and Assessment of Ecosystem Services) initiative.
  classification: "Various continuous/categorical indicators (see individual layer descriptions)"
  access:
    - method: "PMTiles"
      url: "Served via the viewer"
    - method: "Download (LPD)"
      url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/LPD/"
    - method: "Download (Flood)"
      url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-EFAS/flood_hazard/"
    - method: "Download (INCA)"
      url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/MAES/INCA/LATEST/"
  accuracy: >
    LPD: Based on well-established NDVI trend analysis; validated against ground
    observations and national statistics. Flood Hazard: Calibrated against historical
    flood events. INCA: Modeled indicators, validated against field measurements where available.
  papers:
    - text: "Cherlet et al. (2018). World Atlas of Desertification. JRC (includes LPD methodology)."
      key: true
    - text: "Alfieri et al. (2014). Advances in pan-European flood hazard mapping. Hydrological Processes."
    - text: "Maes et al. (2020). Mapping and Assessment of Ecosystems and their Services (MAES). JRC."
  related:
    - name: "HR-VPP Phenology"
      desc: "10m vegetation phenology (complementary)"
      link: "hrvpp-phenology.html"
    - name: "MODIS NDVI/EVI"
      desc: "Global vegetation indices"
      link: "gibs-vegetation.html"
  attribution: "JRC / European Commission / Copernicus"
  provider: "JRC / Copernicus"

# ──────────────────────────────────────────────────────────────────
# AUSTRALIA/NZ
# ──────────────────────────────────────────────────────────────────
australia:
  title: "Australia Land Use (ABARES) & DEA Land Cover"
  executive_summary: >
    Australian agricultural land use and land cover datasets from ABARES (Australian
    Bureau of Agricultural and Resource Economics and Sciences) and Digital Earth
    Australia (DEA). ABARES provides detailed land use classification including crop
    types, while DEA provides annual 25m land cover from Landsat. Together they map
    Australia's diverse agricultural landscape from extensive grazing to intensive cropping.
  coverage: "Australia"
  resolution: "Various (25m DEA, 50m+ ABARES)"
  temporal: "DEA: 1988-present; ABARES: periodic updates"
  license: "CC-BY 4.0"
  description: >
    ABARES Land Use of Australia provides detailed classification of land use including
    cropping (cereals, oilseeds, pulses, sugar), horticulture, grazing, forestry, and
    non-agricultural uses. Digital Earth Australia Land Cover provides annual 25m land
    cover from Landsat archive, classifying into broad types including cropland.
  provenance: >
    ABARES: Australian Government, Department of Agriculture. Combines remote sensing
    with agricultural census and survey data. DEA: Geoscience Australia, processed
    from Landsat archive using the Open Data Cube.
  classification: "ABARES: ALUM (Australian Land Use and Management) classification, 6 primary classes with detailed subclasses"
  access:
    - method: "WMS"
      url: "https://www.agriculture.gov.au/abares/aclump/land-use"
    - method: "Download (DEA)"
      url: "https://www.ga.gov.au/scientific-topics/dea/dea-data-and-products"
  accuracy: >
    ABARES land use mapping achieves >85% accuracy for broad land use categories.
    DEA Land Cover: overall accuracy ~80% for broad classes.
  papers:
    - text: "ABARES (2021). Land Use of Australia. Australian Government."
      key: true
  related:
    - name: "New Zealand LCDB"
      desc: "NZ land cover database"
      link: "newzealand.html"
    - name: "ESA WorldCover"
      desc: "Global 10m land cover"
      link: "esa-worldcover.html"
  attribution: "ABARES / Geoscience Australia / DEA"
  provider: "Australian Government"

newzealand:
  title: "New Zealand Land Cover Database (LCDB)"
  executive_summary: >
    National land cover classification for New Zealand at 1:50,000 scale,
    produced by Landcare Research/Manaaki Whenua. The LCDB maps 33 land cover
    classes across all of New Zealand including cropland, horticulture, and
    pastoral classes. Updated approximately every 5 years from 1996.
  coverage: "New Zealand"
  resolution: "1:50,000 (polygon, ~1ha MMU)"
  temporal: "1996, 2001, 2008, 2012, 2018"
  license: "CC-BY 4.0"
  description: >
    The LCDB provides a multi-temporal, thematic classification of land cover
    for mainland New Zealand, the Chatham Islands, and some offshore islands.
    Agricultural classes include short-rotation cropland, orchard/vineyard/nursery,
    high producing grassland, low producing grassland, and exotic forest.
  provenance: >
    Landcare Research / Manaaki Whenua. Semi-automated classification from Landsat
    and SPOT imagery, with extensive manual editing and quality control.
  classification: "33 classes including: Short-rotation Cropland, Orchard/Vineyard/Nursery, High Producing Grassland, Low Producing Grassland"
  access:
    - method: "WMS"
      url: "https://lris.scinfo.org.nz/layer/lcdb"
    - method: "Download"
      url: "https://lris.scinfo.org.nz/layer/104400-lcdb-v50-land-cover-database-version-50-mainland-new-zealand/"
  accuracy: >
    Overall accuracy ~94% at level 1. Cropland classes achieve >85% accuracy.
  papers:
    - text: "Thompson et al. (2003). New Zealand Land Cover Database Version 2. International Journal of Remote Sensing."
      key: true
  attribution: "Landcare Research / Manaaki Whenua"
  provider: "Landcare Research"

# ──────────────────────────────────────────────────────────────────
# AMERICAS
# ──────────────────────────────────────────────────────────────────
argentina:
  title: "Argentina (GeoINTA)"
  executive_summary: >
    Agricultural land use maps for Argentina from INTA (Instituto Nacional de
    Tecnologia Agropecuaria) via the GeoINTA platform. Maps major crop types
    in the Pampas and other agricultural regions using satellite imagery.
  coverage: "Argentina"
  resolution: "Various (30m-250m)"
  temporal: "Various years"
  license: "Open (INTA)"
  description: >
    GeoINTA provides geospatial agricultural data for Argentina including crop
    type maps, land use change, and agro-climatic data. Argentina is a major
    global producer of soybeans, maize, wheat, and sunflower.
  provenance: "INTA (Instituto Nacional de Tecnologia Agropecuaria), Argentina's national agricultural research institute."
  classification: "Major crops: Soybean, Maize, Wheat, Sunflower, Sorghum, plus grassland and forest"
  access:
    - method: "WMS"
      url: "https://geointa.inta.gob.ar/"
  accuracy: "Varies by product and year. Major crop accuracy typically >80%."
  papers:
    - text: "INTA (various). GeoINTA technical documentation."
      key: true
  attribution: "INTA / Government of Argentina"
  provider: "INTA"

# ──────────────────────────────────────────────────────────────────
# VIIRS VEGETATION INDICES
# ──────────────────────────────────────────────────────────────────
viirs-vegetation:
  title: "VIIRS Vegetation Indices (NDVI & EVI)"
  executive_summary: >
    Global 8-day composite vegetation indices from the VIIRS sensor on Suomi NPP,
    providing NDVI and EVI at 375m resolution. Successor to MODIS vegetation products
    with improved spatial resolution and radiometric quality.
  coverage: "Global"
  resolution: "375m"
  temporal: "2025–present (8-day composites)"
  license: "Public domain (US Government work)"
  description: >
    VIIRS (Visible Infrared Imaging Radiometer Suite) vegetation index products
    continue the legacy of MODIS vegetation monitoring with improved capabilities.
    NDVI (Normalized Difference Vegetation Index) measures overall vegetation greenness.
    EVI (Enhanced Vegetation Index) provides improved sensitivity in high-biomass
    tropical regions and reduces atmospheric and soil background effects.
    Both are 8-day composites using maximum value compositing.
  provenance: "NASA EOSDIS via GIBS (Global Imagery Browse Services). Sensor: VIIRS on Suomi NPP satellite."
  classification: "Continuous index values: NDVI (-1 to 1), EVI (-1 to 1). Higher values indicate denser vegetation."
  access:
    - method: "WMS (GIBS)"
      url: "https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi"
      layer: "VIIRS_SNPP_NDVI_8Day / VIIRS_SNPP_EVI_8Day"
  accuracy: "VIIRS vegetation indices are validated to Stage 2 maturity with global accuracy comparable to MODIS."
  papers:
    - text: "Didan K et al. (2018). VIIRS Vegetation Index Product Suite Algorithm Theoretical Basis Document."
      key: true
  related:
    - name: "MODIS NDVI/EVI"
      desc: "Predecessor vegetation index products at 250m–1km"
    - name: "HR-VPP Phenology"
      desc: "Sentinel-2 phenology at 10m (Europe only)"
  attribution: "NASA EOSDIS / LPDAAC"
  provider: "NASA"

# ──────────────────────────────────────────────────────────────────
# MODIS BIOPHYSICAL (LAI, FPAR, GPP)
# ──────────────────────────────────────────────────────────────────
modis-biophysical:
  title: "MODIS LAI, FPAR & GPP"
  executive_summary: >
    Global biophysical parameters from MODIS: Leaf Area Index (LAI), Fraction of
    Photosynthetically Active Radiation (FPAR), and Gross Primary Productivity (GPP).
    These complement vegetation indices by quantifying canopy structure, light
    interception, and carbon fixation rates at 500m–1km resolution.
  coverage: "Global"
  resolution: "500m (LAI/FPAR), 500m (GPP)"
  temporal: "2000–present (8-day composites)"
  license: "Public domain (US Government work)"
  description: >
    LAI (Leaf Area Index) quantifies the one-sided green leaf area per unit ground
    surface area — a key structural parameter for crop growth models. FPAR measures
    the fraction of incoming solar radiation (400–700nm) absorbed by vegetation
    canopies for photosynthesis. GPP (Gross Primary Productivity) estimates the
    total amount of carbon fixed by vegetation through photosynthesis, critical for
    carbon cycle monitoring and crop yield estimation.
  provenance: >
    NASA EOSDIS products MCD15A2H (LAI/FPAR) and MOD17A2H (GPP).
    LAI/FPAR: MODIS Combined Terra+Aqua 8-day composite.
    GPP: MODIS Terra 8-day composite using the Biome Properties Look-Up Table approach.
  classification: >
    Continuous values. LAI: 0–10 m²/m² (cropland typically 1–6).
    FPAR: 0–1.0 (fraction). GPP: 0–3000 g C/m²/yr.
  access:
    - method: "WMS (GIBS)"
      url: "https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi"
      layer: "MODIS_Combined_L4_LAI_8Day / MODIS_Combined_L4_FPAR_8Day / MODIS_Terra_L4_Gross_Primary_Productivity_8Day"
  accuracy: >
    LAI/FPAR validated to Stage 3 maturity. Uncertainty: LAI ±0.66 m²/m²,
    FPAR ±0.12 for broadleaf crops. GPP validated against FLUXNET eddy covariance towers.
  papers:
    - text: "Myneni RB et al. (2002). Global products of vegetation leaf area and fraction absorbed PAR from year one of MODIS data. Remote Sensing of Environment 83(1-2):214-231."
      doi: "10.1016/S0034-4257(02)00074-3"
      key: true
    - text: "Running SW et al. (2004). A Continuous Satellite-Derived Measure of Global Terrestrial Primary Production. BioScience 54(6):547-560."
      doi: "10.1641/0006-3568(2004)054[0547:ACSMOG]2.0.CO;2"
  related:
    - name: "MODIS NDVI/EVI"
      desc: "Vegetation indices from the same sensor"
    - name: "VIIRS NDVI/EVI"
      desc: "Next-generation vegetation indices at improved resolution"
  attribution: "NASA EOSDIS / LPDAAC"
  provider: "NASA"
